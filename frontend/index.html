<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="TicketFlow — Premium ticket booking platform for movies and concerts with real-time seat selection">
  <title>TicketFlow — Book Your Experience</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <!-- Animated Background Orbs -->
  <div class="bg-orb bg-orb-1"></div>
  <div class="bg-orb bg-orb-2"></div>
  <div class="bg-orb bg-orb-3"></div>
  <div class="bg-orb bg-orb-4"></div>

  <!-- Navigation -->
  <nav class="navbar" id="navbar">
    <div class="nav-container">
      <a href="#/" class="nav-logo" onclick="navigate('/')">
        <span class="logo-icon">🎟️</span>
        <span class="logo-text">TicketFlow</span>
      </a>
      <div class="nav-links" id="nav-links">
        <a href="#/" class="nav-link" onclick="navigate('/')">Events</a>
        <span id="nav-auth-links"></span>
      </div>
      <div class="nav-actions">
        <div id="nav-user-section"></div>
      </div>
    </div>
  </nav>

  <!-- Main App Container -->
  <main id="app" class="app-container">
    <div class="loading-screen" id="loading-screen">
      <div class="loading-logo">🎟️</div>
      <div class="loading-text">TicketFlow</div>
      <div class="loading-bar"><div class="loading-fill"></div></div>
    </div>
  </main>

  <!-- Toast Notification -->
  <div class="toast-container" id="toast-container"></div>

  <!-- Modal -->
  <div class="modal-overlay" id="modal-overlay">
    <div class="modal" id="modal">
      <button class="modal-close" onclick="closeModal()">✕</button>
      <div id="modal-content"></div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="/js/app.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/events.js"></script>
  <script src="/js/seatmap.js"></script>
  <script src="/js/checkout.js"></script>
  <script src="/js/bookings.js"></script>
  <script src="/js/organiser.js"></script>
  <script src="/js/admin.js"></script>
</body>
</html>
